[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "findata-research"
version = "0.2.0"
description = "Local OpenBB financial database, screeners and on-demand HTML/email reports"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "pyarrow>=18", "duckdb>=1.2", "requests>=2.32", "yfinance>=0.2.66", "python-dotenv>=1.0"]

[project.optional-dependencies]
cloud = ["boto3>=1.36"]
openbb = ["openbb>=4,<5", "openbb-nasdaq<2", "openbb-yfinance<2", "openbb-sec<2"]
universe = ["financedatabase>=2"]
analytics = ["financetoolkit>=2"]

[project.scripts]
findata = "findata.cli:main"

[tool.setuptools.packages.find]
include = ["findata*"]

[tool.setuptools.package-data]
"findata" = ["_vendor/auto_dcf/*.ods", "_vendor/auto_dcf/*.yml", "_vendor/auto_dcf/*.json", "_vendor/auto_dcf/README.*", "_vendor/auto_dcf/.gitignore"]
