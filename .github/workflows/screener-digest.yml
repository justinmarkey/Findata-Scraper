name: Screener email digest

on:
  schedule:
    # BEGIN CONFIGURED SCHEDULE
    - cron: '30 7 * * *'
      timezone: America/New_York
    - cron: '0 20 * * *'
      timezone: America/New_York
    # END CONFIGURED SCHEDULE
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build a preview without sending email
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: findata-cloud-state
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FINDATA_S3_BUCKET: ${{ secrets.FINDATA_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.FINDATA_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.FINDATA_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.FINDATA_AWS_REGION || 'us-east-1' }}
      S3_ENDPOINT_URL: ${{ vars.FINDATA_S3_ENDPOINT_URL }}
      REPORT_TO: ${{ secrets.FINDATA_REPORT_TO }}
      SMTP_USERNAME: ${{ secrets.FINDATA_SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.FINDATA_SMTP_PASSWORD }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install report dependencies
        run: python -m pip install '.[cloud]'
      - name: Generate and deliver the digest
        shell: bash
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m findata.cloud --dry-run
          else
            python -m findata.cloud
          fi
      - name: Save report preview for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-digest-${{ github.run_id }}
          path: data/reports/cloud-digest/
          retention-days: 7
          if-no-files-found: ignore
